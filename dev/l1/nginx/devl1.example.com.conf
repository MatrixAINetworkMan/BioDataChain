# =============================================================================
# nginx 反代配置 — MyChain L1 dev 浏览器 + RPC
# 域名：devl1.example.com
#
# 部署：
#   sudo cp dev/l1/nginx/devl1.example.com.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 前置：
#   - L1 + Blockscout 在本机跑起来（make up && make blockscout-up）
#     占用 127.0.0.1 的：
#       3001 Blockscout frontend
#       4001 Blockscout backend (REST/GraphQL + Phoenix WS)
#       8081 Blockscout stats (首页 Daily transactions tile + Charts)
#       8545 L1 geth HTTP RPC
#       8546 L1 geth WebSocket RPC
#   - HTTPS 证书放在 ssl/example.com.pem / .key（通配证书）
#
# !!! 前提：nginx.conf 的 http {} 段必须有这个 map，否则 WebSocket 升级失败 !!!
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
# Ubuntu 默认 nginx.conf 没有，需要在 /etc/nginx/nginx.conf 的 http {} 里加一次。
# =============================================================================

# -----------------------------------------------------------------------------
# HTTP → HTTPS 跳转
# -----------------------------------------------------------------------------
server {
    listen 80;
    server_name devl1.example.com;
    return 301 https://$host$request_uri;
}

# -----------------------------------------------------------------------------
# HTTPS 主入口
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name devl1.example.com;

    ssl_certificate     ssl/example.com.pem;
    ssl_certificate_key ssl/example.com.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    ssl_prefer_server_ciphers off;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";

    # 浏览器 / nginx 之间允许较大响应（contract verify 源码、trace 等）
    client_max_body_size 50m;
    proxy_http_version  1.1;
    proxy_read_timeout  120s;
    proxy_send_timeout  120s;

    # -------------------------------------------------------------------------
    # Blockscout backend REST API + Phoenix WebSocket + sitemap + auth
    # 端口 4001 = L1 backend（跟 L2 的 4000 完全不同，别串了）
    # -------------------------------------------------------------------------
    location ~ ^/(api|socket|sitemap\.xml|auth/auth0|auth/auth0/callback|auth/logout) {
        proxy_pass http://127.0.0.1:4001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # WebSocket 升级（实时刷新 latest blocks 必须）
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout   300s;
        proxy_read_timeout   300s;
    }

    # -------------------------------------------------------------------------
    # Blockscout stats 微服务（首页 Daily transactions 图表数据源）
    # 端口 8081 = L1 stats（L2 上是 4002）
    # 路径末尾的 `/` 是 strip /stats-api 前缀的关键
    # -------------------------------------------------------------------------
    location /stats-api/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # stats 默认 CORS=*，浏览器 preflight 不被 nginx 拦
        proxy_pass_request_headers on;
    }

    # -------------------------------------------------------------------------
    # L1 RPC HTTPS 端点（钱包 / Foundry / op-deployer 接入）
    # 客户配置 RPC URL 时填：https://devl1.example.com/rpc
    # 注意：用 `location = /rpc` 精确匹配，避免被 /rpc/xxx 之类的路径污染
    # -------------------------------------------------------------------------
    location = /rpc {
        proxy_pass http://127.0.0.1:8545/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        client_max_body_size 10m;
    }

    # -------------------------------------------------------------------------
    # L1 RPC WSS 端点（订阅 newHeads / logs）
    # 客户配置：wss://devl1.example.com/ws
    # -------------------------------------------------------------------------
    location = /ws {
        proxy_pass http://127.0.0.1:8546/;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    # -------------------------------------------------------------------------
    # Blockscout frontend (Next.js)
    # 兜底路由 — 上面没匹配到的全转给 frontend
    # 端口 3001 = L1 frontend（L2 那份 conf 这里写的是 4000，是错的）
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }
}
